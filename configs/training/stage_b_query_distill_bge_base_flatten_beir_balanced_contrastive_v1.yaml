lr: 1.0e-5
max_steps: 3000
warmup_steps: 300
min_lr: 1.0e-6
scheduler: cosine
query_mse_weight: 0.3
doc_mse_weight: 0.3
negative_mse_weight: 0.05
ranking_weight: 0.75
infonce_weight: 0.3
temperature: 0.05
margin: 0.10
selection_metric: beir_proxy_ndcg@10
beir_probe_config: configs/retrieval/beir3_stage_b_bge_base_leaf.yaml
beir_probe_samples: 20
beir_probe_samples_per_dataset: 100
beir_probe_negatives: 200
beir_probe_batch_size: 8
epochs: 9999
val_split: 0.02
val_every: 250
early_stopping_patience: 5
device: cuda:0
