recipe: query_distill
run_id: stage-b-query-distill-bge-base-flatten-beir-balanced-contrastive-v1
run_base_dir: artifacts/query_distill_runs
oscar_model: naver/oscar-qwen2-7B
teacher_embeddings:
  - artifacts/teacher-embeddings/query-doc-bge-base-combined-hard/scifact-test-hybrid.h5
  - artifacts/teacher-embeddings/query-doc-bge-base-combined-hard/nfcorpus-train-hybrid.h5
  - artifacts/teacher-embeddings/query-doc-bge-base-combined-hard/fiqa-train-bge-dense.h5
embed_dim: 768
pooler: flatten
dropout: 0.05
projector_hidden_dim: 8192
