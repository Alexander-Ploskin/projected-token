val_split: 0.02
val_every: 250
early_stopping_patience: 6
beir_probe_config: configs/retrieval/beir3_proxy_multi_stage_b.yaml
beir_probe_samples: 120
beir_probe_samples_per_dataset: 120
beir_probe_negatives: 250
beir_probe_batch_size: 8
beir_full_eval_config: configs/retrieval/beir3_stage_b_bge_base_leaf.yaml
beir_full_eval_every: 1000
selection_metric: beir_proxy_ndcg@10
dataset_sampling_weights:
  scifact: 0.18
  trec-covid: 0.18
  fiqa: 0.17
  nfcorpus: 0.15
  arguana: 0.12
