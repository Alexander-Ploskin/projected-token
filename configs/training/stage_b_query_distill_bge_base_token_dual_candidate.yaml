recipe: query_distill
run_id: stage-b-query-distill-bge-base-token-dual-candidate
run_base_dir: artifacts/query_distill_runs_token_dual
oscar_model: naver/oscar-qwen2-7B
teacher_embeddings:
  - artifacts/teacher-embeddings/query-doc-bge-base-candidates/scifact-train-candidates.h5
  - artifacts/teacher-embeddings/query-doc-bge-base-candidates/nfcorpus-train-candidates.h5
  - artifacts/teacher-embeddings/query-doc-bge-base-candidates/fiqa-train-candidates.h5
  - artifacts/teacher-embeddings/query-doc-bge-base-candidates/arguana-train-candidates.h5
  - artifacts/teacher-embeddings/query-doc-bge-base-candidates/trec-covid-train-candidates.h5
  - artifacts/teacher-embeddings/query-doc-bge-base-candidates/msmarco-candidates.h5
  - artifacts/teacher-embeddings/query-doc-bge-base-candidates/quora-train-candidates.h5
embed_dim: 768
pooler: flatten
projector_type: token_dual
