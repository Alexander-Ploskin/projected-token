recipe: query_distill
run_id: stage-b-query-distill-bge-base-token-dual-archonly
run_base_dir: .artifacts_local/query_distill_runs_token_dual
oscar_model: naver/oscar-qwen2-7B
teacher_embeddings:
  - data/teacher-embeddings/query-doc-bge-base-full/msmarco-hard.h5
  - data/teacher-embeddings/query-doc-bge-base-full/nfcorpus-train-hard.h5
  - data/teacher-embeddings/query-doc-bge-base-full/fiqa-train-hard.h5
  - data/teacher-embeddings/query-doc-bge-base-full/arguana-train-hard.h5
