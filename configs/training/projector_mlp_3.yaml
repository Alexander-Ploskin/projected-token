recipe: mlp
# Variant A: MLP проектор (только проектор обучается, OSCAR заморожен)

oscar_model_name: "naver/oscar-qwen2-7B"

embed_dim: 768

pooler: "mean"
num_layers: 3  # 1, 2, или 3 слоя
dropout: 0.0   # 0.0 для 1 слоя без dropout

batch_size: 256
lr: 1e-4
temperature: 0.05

epochs: 5
val_split: 0.02
val_every_n_steps: 500

device: "cuda:0"

output_dir: "./checkpoints/projector_mlp_3"
log_dir: "./logs/projector_mlp_3"

max_train_samples: null
max_val_samples: null