# Schema sketch for projector training recipes.
recipe: mlp  # mlp | lora | full | flat | msmarco | msmarco_v2 | distill | hotpot_distill
oscar_model_name: naver/oscar-qwen2-7B
embed_dim: 768
pooler: mean
num_layers: 1
dropout: 0.0
batch_size: 512
lr: 1.0e-4
temperature: 0.05
epochs: 3
val_split: 0.02
val_every_n_steps: 500
device: cuda:0
output_dir: artifacts/checkpoints/projector_mlp
log_dir: artifacts/results/logs/projector_mlp
