model:
  model_name_or_path: "cache/qwen25"
  xrag_token: "[XRAG]"
  use_flash_attn_2: false
  freeze_llm: true          # finetune usually unfreezes LLM, but we follow xrag
  torch_dtype: "bf16"        # "bf16" | "fp16" | "auto"

retriever:
  retriever_name_or_path: "cache/retriever/retriever"
  freeze_retriever: true
  min_length: 32
  max_length: 180
  crop_strategy: "log_uniform"   # uniform | log_uniform

projector:
  hidden_dim: 1024
  dropout: 0.0
  checkpoint: runs/xrag_default/step_4500/projector.pt

data:
  train_file: "cache/qa_train.jsonl"
  dev_file: "cache/qa_dev.jsonl"
  max_seq_length: 512
  retrieval_embed_length: 1
  preprocessing_num_workers: 24
  finetune_context_source: "all_user"
  replace_user_with_xrag: true
  overwrite_cache: false
  xrag_user_prefix: "Please answer this question: "

train:
  seed: 1234
  output_dir: ./runs/xrag_sft
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16

  learning_rate: 0.006
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: linear
  num_train_epochs: 1
  max_train_steps: null

  clip_grad_norm: 1.0
  checkpoint_every_steps: 1500
  eval_every_steps: 200

logging:
  backends: ["console"]
  project_name: projected_token
  run_name: xrag_default
  log_every_steps: 20

distributed:
  mixed_precision: bf16
  gradient_accumulation_steps: 2

objective:
  alpha_nll: 1.0
  alpha_kl: 0.5
  kl_temperature: 3.0
