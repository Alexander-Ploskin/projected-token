dataset:
  path: data/eval/popqa/popqa_enriched.parquet
  text_col: s_wiki_content
  id_col: id
encoder:
  name: oscar_projector
  kwargs:
    oscar_model_name: naver/oscar-qwen2-7B
    projector_path: artifacts/checkpoints/projector_mlp/best_model.pt
    device: cuda:0
    embed_dim: 768
    pooler: mean
    num_layers: 1
    dropout: 0.0
index:
  output_dir: artifacts/indexes/popqa_oscar_projector
  metric: ip
  normalize: true
  batch_size: 32
task:
  name: popqa
  question_col: question
metrics:
  top_k: [1, 3, 5, 10, 20]
  output_path: artifacts/results/retrieval/popqa_oscar_projector_metrics.json
