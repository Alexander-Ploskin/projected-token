encoder:
  name: oscar_projector
  kwargs:
    oscar_model_name: naver/oscar-qwen2-7B
    projector_path: artifacts/query_distill_runs/e9-flatten-kl-4096/checkpoints/checkpoint_step_6000.pt
    device: cuda:0
    embed_dim: 768
    pooler: flatten
    num_layers: 2
    dropout: 0.0
index:
  metric: ip
  normalize: true
  batch_size: 256
split: test
search_k: 100
datasets:
  - name: nq
    path: /data/beir/nq
metrics:
  top_k: [1, 3, 5, 10, 20]
  output_path: artifacts/results/retrieval/beir_nq_e9_6000/summary.json
  output_csv_path: artifacts/results/retrieval/beir_nq_e9_6000/summary.csv
  run_id: beir_nq_e9_6000
