encoder:
  name: bge
  kwargs:
    model_name_or_path: BAAI/bge-base-en-v1.5
    device: cuda:0
    normalize_embeddings: true
    query_prefix: "Represent this sentence for searching relevant passages: "
    document_prefix: ""
index:
  metric: ip
  normalize: true
  batch_size: 32
split: test
search_k: 100
datasets:
  - name: scifact
    path: data/beir/scifact
  - name: nfcorpus
    path: data/beir/nfcorpus
  - name: fiqa-2018
    path: data/beir/fiqa
metrics:
  top_k: [1, 3, 5, 10, 20]
  output_dir: .artifacts_local/results/retrieval/beir3_teacher_bge_base_v15
  output_path: .artifacts_local/results/retrieval/beir3_teacher_bge_base_v15_summary.json
  output_csv_path: .artifacts_local/results/retrieval/beir3_teacher_bge_base_v15_summary.csv
  run_id: beir3_teacher_bge_base_v15
