encoder:
  name: oscar_projector
  kwargs:
    oscar_model_name: naver/oscar-qwen2-7B
    projector_path: artifacts/query_distill_runs/e1-5ep-beir5-noquora/checkpoints/checkpoint_step_2250.pt
    device: cuda:0
    embed_dim: 768
    pooler: flatten
    num_layers: 2
    dropout: 0.0
index:
  metric: ip
  normalize: true
  batch_size: 32
split: test
search_k: 100
datasets:
  - name: nfcorpus
    path: data/beir/nfcorpus
  - name: fiqa-2018
    path: data/beir/fiqa
metrics:
  top_k: [1, 3, 5, 10, 20]
  output_path: artifacts/results/retrieval/beir_mini_nfcorpus/summary.json
  output_csv_path: artifacts/results/retrieval/beir_mini_nfcorpus/summary.csv
  run_id: beir_mini_nfcorpus
