encoder:
  name: oscar_projector
  kwargs:
    oscar_model_name: naver/oscar-qwen2-7B
    projector_path: artifacts/query_distill_runs/e11-pertoken-gated/checkpoints/best_model.pt
    device: cuda:0
    embed_dim: 768
    pooler: per_token_gated
    num_layers: 2
    dropout: 0.15
    projector_hidden_dim: 1024
index:
  metric: ip
  normalize: true
  batch_size: 32
split: test
search_k: 100
datasets:
  - name: fiqa-2018
    path: data/beir/fiqa
  - name: quora
    path: data/beir/quora
  - name: trec-covid
    path: data/beir/trec-covid
metrics:
  top_k: [1, 3, 5, 10, 20]
  output_path: artifacts/results/retrieval/e11_best_fiqa_quora_trec/summary.json
  output_csv_path: artifacts/results/retrieval/e11_best_fiqa_quora_trec/summary.csv
  run_id: e11_best_fiqa_quora_trec
