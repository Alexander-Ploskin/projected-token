encoder:
  name: bge_base_en_v15
  kwargs:
    model_name_or_path: BAAI/bge-base-en-v1.5
    device: cuda:0
    trust_remote_code: true
index:
  metric: ip
  normalize: true
  batch_size: 32
split: test
search_k: 100
datasets:
  - name: scifact
    path: data/beir/scifact
  - name: nfcorpus
    path: data/beir/nfcorpus
  - name: fiqa-2018
    path: data/beir/fiqa
  - name: arguana
    path: data/beir/arguana
  - name: trec-covid
    path: ../trec-covid
  - name: quora
    path: data/beir/quora
metrics:
  top_k: [1, 3, 5, 10, 20]
  output_path: artifacts/results/retrieval/beir6_bge_base_en_v15/summary.json
  output_csv_path: artifacts/results/retrieval/beir6_bge_base_en_v15/summary.csv
  run_id: beir6_bge_base_en_v15
